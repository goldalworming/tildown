name: Android

# APK (TWA) yang membuka web app di Chrome layar penuh. Dibangun saat android/
# berubah, dan oleh Release untuk dilampirkan ke setiap rilis.
# Butuh secret KEYSTORE_B64 (base64 dari tildown-android.jks) dan KEY_PASS.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # Tanpa kunci: lewati (rilis desktop tetap jalan, tanpa APK).
          [ -n "$KEYSTORE_B64" ] || { echo "::notice::secret KEYSTORE_B64 belum diisi, APK dilewati"; exit 0; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
          export KEYSTORE="$RUNNER_TEMP/k.jks"
          export VERSION_CODE=$(git rev-list --count HEAD)
          export VERSION_NAME=$(git describe --tags --always)
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "TilDown-${VERSION_NAME#v}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.apk'
          if-no-files-found: ignore
